{% load static %}

<section id="about-hero" class="scroll-anim-about-image border-b border-[color:var(--line-soft)]">
    {# Mobile image — hidden at lg and above #}
     <img src="{% static 'AboutusHeroMobile.png' %}"
         alt="{{ about_hero_section.image_alt }}"
         width="1080"
         height="1920"
         class="block w-full lg:hidden">
    {# Desktop image — hidden below lg #}
     <img src="{% static 'AboutusHero.png' %}"
         alt="{{ about_hero_section.image_alt }}"
         width="1920"
         height="1080"
         class="hidden w-full lg:block">
</section>
